<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Alepa-fillarit</title>

  <!-- PWA: asennettavuus puhelimen kotivalikkoon -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#12b76a" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fillarit" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Kartan kääntö (rotate): kahdella sormella puhelimessa, Shift+veto koneella -->
  <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="map"></div>

  <div class="searchwrap">
    <div class="searchbar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Minne menet?" autocomplete="off" />
      <span class="clr" id="clr">×</span>
    </div>
    <div class="results" id="results"></div>
  </div>

  <button class="fab" id="locate" title="Paikanna minut">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
  </button>

  <div class="sheet" id="sheet">
    <div class="grip-zone" id="gripZone"><div class="grip"></div></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
